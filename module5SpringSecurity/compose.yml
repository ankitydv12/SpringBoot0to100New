version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: securityapp-mysql

    environment:
      MYSQL_ROOT_PASSWORD: 123
      MYSQL_DATABASE: securityapp

    ports:
      - "3306:3306"

    volumes:
      - mysql_data:/var/lib/mysql

    restart: unless-stopped

volumes:
  mysql_data: